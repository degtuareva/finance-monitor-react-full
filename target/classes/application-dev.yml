spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/finance_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
app:
  cors:
    allowed-origins: http://localhost:5173
